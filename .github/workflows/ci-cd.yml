name: ci-cd
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Set up OS
    runs-on: ubuntu-latest

    # Job steps
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install required packages
        run: python -m pip install -r requirements_dev.txt

      - name: Perform Bandit Analysis
        run: python -m bandit -r -x "tests" src

      - name: Run unit tests
        run: python -m pytest -v --cov=src --cov-fail-under=90 --cov-report=term-missing

  cd:
    permissions:
      contents: write
      id-token: write
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Checkout full repository for versioning

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Prepare new release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: $ {{ secrets.GITHUB_TOKEN }}

      - name: Publish package TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Test install from TestPyPI
        run: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple comet-wifi-communicator

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      #- name: Create Github Release
      #  uses: python-semantic-release/upload-to-gh-release@main
      #  if: steps.release.outputs.released == 'true'
      #  with:
      #    github_token: ${{ secrets.GITHUB_TOKEN }}